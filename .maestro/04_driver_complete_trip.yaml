appId: com.orbi.driver
name: "Driver — Completer la course (arrivee -> depart -> fin)"
---
# Pré-requis: driver avec trip MATCHED (après 03_driver_accept_offer)
- launchApp

# Confirmer l'arrivée au pickup
- tapOn: "Offres"
- tapOn:
    text: "Arrivé au pickup"
    optional: true
- tapOn:
    text: "Signaler l arrivee"
    optional: true
- tapOn:
    text: "Je suis arrive"
    optional: true

# Demarrer uniquement quand le passager est dans le vehicule ou sur la moto
- tapOn:
    text: "Demarrer la course"
    optional: true
- tapOn:
    text: "Démarrer la course"
    optional: true

# Vérifier le passage en IN_PROGRESS
- assertVisible:
    text: "En cours"
    optional: true

# Terminer la course
- tapOn:
    text: "Terminer la course"
    optional: true

# Vérifier l'affichage du résumé / revenus
- assertVisible:
    text: "FCFA"
    optional: true
- assertVisible:
    text: "Revenus"
    optional: true
