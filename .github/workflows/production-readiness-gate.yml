name: Production Readiness Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Production gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orbi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orbi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: true
      NODE_ENV: test
      SKIP_DB_CONNECT: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orbi?schema=public
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_API_VERSION: v1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Apply database migrations
        run: pnpm --filter backend exec prisma migrate deploy

      - name: Check migration status
        run: pnpm --filter backend exec prisma migrate status

      - name: Source risk gates
        run: pnpm quality:source

      - name: Run production readiness gate
        run: pnpm test:production:gate
