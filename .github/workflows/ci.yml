name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orbi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orbi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: true
      NODE_ENV: test
      SKIP_DB_CONNECT: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orbi?schema=public
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_API_VERSION: v1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Show tool versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Whitespace diff check
        run: git diff --check

      - name: Production secret hygiene gate
        run: >-
          node ./scripts/testing/production-readiness-gate.mjs
          --skip-audit
          --skip-prisma
          --skip-backend-readiness
          --skip-payment-fixtures
          --skip-admin-smoke
          --skip-mobile-smoke
          --skip-typecheck

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Validate Prisma schema
        run: pnpm --filter backend exec prisma validate

      - name: Apply database migrations
        run: pnpm --filter backend exec prisma migrate deploy

      - name: Backend tests
        run: pnpm --filter backend exec jest --runInBand --ci --forceExit

      - name: Admin web smoke tests
        run: pnpm test:admin:smoke

      - name: Mobile smoke tests
        run: pnpm test:mobile:smoke

      - name: Typecheck and builds
        run: pnpm typecheck

      - name: Seed local API smoke data
        run: pnpm prisma:seed

      - name: Start backend for local API smoke
        env:
          NODE_ENV: development
          SKIP_DB_CONNECT: false
          PORT: 3000
          ENABLE_SWAGGER: 'false'
          PAYMENTS_WEBHOOK_SECRET: ${{ secrets.CI_WEBHOOK_SECRET || 'orbi_dev_webhook_secret' }}
        run: |
          pnpm --filter backend start > backend-smoke.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/api/v1/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat backend-smoke.log
          exit 1

      - name: Local API money-path smoke
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass
          -File ./scripts/testing/local-api-e2e-smoke.ps1
          -WebhookSecret "${{ secrets.CI_WEBHOOK_SECRET || 'orbi_dev_webhook_secret' }}"

      - name: Print backend smoke logs on failure
        if: failure()
        run: cat backend-smoke.log || true
