<!-- Orbi Cap — Marque seule (60 × 60) -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 60 60"
  role="img"
  aria-label="Orbi"
>
  <title>Orbi</title>

  <!-- Lueur capsule -->
  <rect x="22" y="0" width="16" height="21" rx="8" fill="#2dd4bf" fill-opacity="0.15"/>

  <!-- Anneau -->
  <circle cx="30" cy="38" r="22" fill="none" stroke="#2dd4bf" stroke-width="2.5"/>

  <!-- Capsule nord -->
  <rect x="26" y="0" width="8" height="17" rx="4" fill="#2dd4bf"/>
</svg>
