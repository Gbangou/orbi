<!-- Orbi — Logo "Cap" : lockup horizontal -->
<!--
  CONCEPT : Un anneau circulaire fin avec une capsule (indicateur de cap/nord) en
  position 12h qui le traverse legèrement par le bas. Le tout forme une boussole
  epuree : l'anneau = le cadran, la capsule = l'aiguille pointant le nord.
  Metaphore : direction, cap, destination, precision. Intemporel et autoritaire.

  GEOMETRIE (viewBox 60 × 60 pour la marque) :
    Anneau : cx=30, cy=38, r=22, stroke-width=2.5
    Anneau top : cy - r = 38 - 22 = 16

    Capsule (indicateur nord) :
      x=26, y=0, width=8, height=17 (bottom=17, overlap avec ring top a y=16 : 1px)
      rx=4
      fill=#2dd4bf
      lueur : rect x=22, y=0, width=16, height=21, rx=8, opacite=0.15

    Marque totale : 60 large × 60 haute (anneau 44px + capsule 17px - chevauchement 1px = 60)

  FICHIERS DERIVES :
    orbi-icon-cap.svg       → marque seule (60 × 60)
    orbi-app-icon-cap.svg   → icone application (1024 × 1024)
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 220 60"
  role="img"
  aria-label="Orbi"
>
  <title>Orbi</title>

  <!-- === MARQUE : CAP === -->

  <!-- Lueur de la capsule -->
  <rect x="22" y="0" width="16" height="21" rx="8" fill="#2dd4bf" fill-opacity="0.15"/>

  <!-- Anneau -->
  <circle
    cx="30" cy="38" r="22"
    fill="none"
    stroke="#2dd4bf"
    stroke-width="2.5"
  />

  <!-- Capsule nord (indicateur de cap) -->
  <rect x="26" y="0" width="8" height="17" rx="4" fill="#2dd4bf"/>

  <!-- === LOGOTYPE === -->
  <text
    x="72"
    y="41"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="32"
    font-weight="800"
    fill="#f8fafc"
    letter-spacing="3"
  >orbi</text>
</svg>
