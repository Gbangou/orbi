<!-- Orbi — Concept "i-dot" : la marque orbitale remplace le point du i -->
<!--
  CONCEPT : Le point de la lettre "i" dans "Orbi" est remplace par la marque
  Orbite (anneau + point-vehicule). Le "i" utilise le caractere sans point (ı, U+0131).

  GEOMETRIE (fond 480 × 180, logotype 64px Raleway ExtraBold) :
    Anneau-i : centre (~310, 48), rayon 18, trait 3.5
    Point-vehicule : 45° du sommet → cx≈322.7, cy≈35.3, rayon 7.5
    Lueur  : meme centre, rayon 14, opacite 0.18

  COULEURS :
    Fond    #07111d     (navy profond)
    Anneau  #2dd4bf     (Orbi teal)
    Texte   #f8fafc     (blanc chaud)
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 480 180"
  role="img"
  aria-label="Orbi"
>
  <title>Orbi — i-dot concept</title>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@300;800&amp;display=swap');
    </style>
    <!-- Lueur douce du point-vehicule -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ═══════════════════════════════════════════════
       FOND — version sombre premium
  ════════════════════════════════════════════════ -->
  <rect width="480" height="180" fill="#07111d" rx="20"/>

  <!-- Grain subtil (cercles concentriques très legers) pour texture premium -->
  <circle cx="240" cy="90" r="200" fill="none" stroke="#ffffff" stroke-opacity="0.012" stroke-width="60"/>
  <circle cx="240" cy="90" r="130" fill="none" stroke="#ffffff" stroke-opacity="0.01"  stroke-width="40"/>

  <!-- ═══════════════════════════════════════════════
       LOGOTYPE — "Orb" + ı (i sans point)
       Raleway ExtraBold 800, 64px
  ════════════════════════════════════════════════ -->

  <!-- "Orb" — les trois premieres lettres -->
  <text
    x="52"
    y="118"
    font-family="Raleway, 'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="64"
    font-weight="800"
    fill="#f8fafc"
    letter-spacing="2"
  >Orb</text>

  <!-- "ı" — i sans point (U+0131), la marque orbitale occupera la place du point -->
  <text
    x="278"
    y="118"
    font-family="Raleway, 'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="64"
    font-weight="800"
    fill="#f8fafc"
    letter-spacing="2"
  >ı</text>

  <!-- ═══════════════════════════════════════════════
       MARQUE ORBITALE — point du i
       Anneau : cx=296, cy=50, r=18
       Point-vehicule a 45° : cx=308.7, cy=37.3
  ════════════════════════════════════════════════ -->

  <!-- Halo ambiant (lueur large et douce) -->
  <circle cx="308.7" cy="37.3" r="22" fill="#2dd4bf" fill-opacity="0.10"/>

  <!-- Anneau orbital -->
  <circle
    cx="296"
    cy="50"
    r="18"
    fill="none"
    stroke="#2dd4bf"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- Point-vehicule a 1h30 (45° depuis le sommet)
       cx = 296 + 18*sin(45°) = 296 + 12.73 = 308.73
       cy = 50  − 18*cos(45°) =  50 − 12.73 =  37.27
  -->
  <circle
    cx="308.7"
    cy="37.3"
    r="7.5"
    fill="#2dd4bf"
    filter="url(#glow)"
  />

  <!-- ═══════════════════════════════════════════════
       LIGNE DE BASELINE  (repere visuel — supprimer en prod)
  ════════════════════════════════════════════════ -->
  <!-- <line x1="40" y1="118" x2="440" y2="118" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 4"/> -->

  <!-- ═══════════════════════════════════════════════
       LABEL DISCRET (optionnel — supprimer si non voulu)
  ════════════════════════════════════════════════ -->
  <text
    x="240"
    y="158"
    font-family="Raleway, 'Helvetica Neue', Arial, sans-serif"
    font-size="11"
    font-weight="300"
    fill="#2dd4bf"
    fill-opacity="0.45"
    text-anchor="middle"
    letter-spacing="4"
  >CONCEPT IDOT</text>

</svg>
