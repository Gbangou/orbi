<!-- Orbi — Logo horizontal (marque + logotype) -->
<!--
  USAGE: fond sombre (#07111d) de preference. Pour fond clair, remplacer fill="#f8fafc" par fill="#07111d".

  GEOMETRIE DE LA MARQUE:
    Anneau : centre (30, 30), rayon 26, trait 3, couleur Orbi Teal
    Point-vehicule : a 45° du sommet sur le bord de l'anneau
      cx = 30 + 26 × sin(45°) = 48.38 ≈ 48.4
      cy = 30 − 26 × cos(45°) = 11.62 ≈ 11.6
      rayon du point = 5.5, lueur = rayon 10 opacite 0.2

  FICHIERS DERIVES:
    orbi-icon.svg         → marque seule (60 × 60)
    orbi-app-icon.svg     → icone application (1024 × 1024, fond inclus)
    orbi-logo-light.svg   → variante fond clair
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 220 60"
  role="img"
  aria-label="Orbi"
>
  <title>Orbi</title>

  <!-- === MARQUE : ORBITE === -->

  <!-- Lueur du point-vehicule (halo ambiant) -->
  <circle cx="48.4" cy="11.6" r="10" fill="#2dd4bf" fill-opacity="0.18"/>

  <!-- Anneau orbital -->
  <circle
    cx="30" cy="30" r="26"
    fill="none"
    stroke="#2dd4bf"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Point-vehicule : sur le bord de l'anneau a 1h30 -->
  <circle cx="48.4" cy="11.6" r="5.5" fill="#2dd4bf"/>

  <!-- === LOGOTYPE === -->
  <text
    x="72"
    y="41"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="32"
    font-weight="800"
    fill="#f8fafc"
    letter-spacing="3"
  >orbi</text>
</svg>
