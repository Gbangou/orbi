<!-- Orbi — Logo "Signal" : lockup horizontal -->
<!--
  CONCEPT : Trois arcs concentriques rayonnant depuis un point (le vehicule/origine)
  vers le haut-droit. Metaphore du reseau de transport, de la portee du dispatch,
  du signal qui couvre la ville. Asymetrique, dynamique, moderne.

  GEOMETRIE (viewBox 60 × 60 pour la marque) :
    Origine (vehicule) : cx=8, cy=52
    Lueur de l'origine : r=10, opacite 0.18
    Point-origine : r=4.5, fill teal

    Arcs (quart de cercle de "3h" vers "12h", centre sur l'origine) :
      Arc 1 : r=13  M 21,52 A 13,13 0 0,0 8,39
      Arc 2 : r=24  M 32,52 A 24,24 0 0,0 8,28
      Arc 3 : r=35  M 43,52 A 35,35 0 0,0 8,17
      stroke-width=3, stroke-linecap=round

  NOTE SVG arc : flag sweep=0 = sens anti-horaire (dans le repere SVG y-down),
  ce qui correspond a un arc allant de la droite vers le haut. C'est le seul
  flag qui trace le bon quart de cercle dans ce repere.

  FICHIERS DERIVES :
    orbi-icon-signal.svg       → marque seule (60 × 60)
    orbi-app-icon-signal.svg   → icone application (1024 × 1024)
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 220 60"
  role="img"
  aria-label="Orbi"
>
  <title>Orbi</title>

  <!-- === MARQUE : SIGNAL === -->

  <!-- Lueur de l'origine -->
  <circle cx="8" cy="52" r="10" fill="#2dd4bf" fill-opacity="0.18"/>

  <!-- Arc externe -->
  <path
    d="M 43,52 A 35,35 0 0,0 8,17"
    fill="none"
    stroke="#2dd4bf"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Arc median -->
  <path
    d="M 32,52 A 24,24 0 0,0 8,28"
    fill="none"
    stroke="#2dd4bf"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Arc interne -->
  <path
    d="M 21,52 A 13,13 0 0,0 8,39"
    fill="none"
    stroke="#2dd4bf"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Point-vehicule (origine des arcs) -->
  <circle cx="8" cy="52" r="4.5" fill="#2dd4bf"/>

  <!-- === LOGOTYPE === -->
  <text
    x="72"
    y="41"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="32"
    font-weight="800"
    fill="#f8fafc"
    letter-spacing="3"
  >orbi</text>
</svg>
