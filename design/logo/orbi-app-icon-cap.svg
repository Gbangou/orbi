<!-- Orbi Cap — Icone application 1024 × 1024 -->
<!--
  GEOMETRIE (echelle depuis 60×60 viewbox, facteur ~12.73) :
    Anneau   : cx=512, cy=613, r=280, stroke=32
    Anneau top : 613 - 280 = 333

    Capsule  : x=462, y=130, width=100, height=216, rx=51
    Capsule bottom : 130+216 = 346
    Chevauchement capsule/anneau : 346 - 333 = 13 px ✓

    Lueur capsule : x=440, y=120, width=144, height=236, rx=72, opacite=0.15

  Controle des bornes :
    Anneau droite + trait/2 : 512+280+16 = 808 < 1024 ✓
    Anneau gauche - trait/2 : 512-280-16 = 216 > 0    ✓
    Anneau bas + trait/2    : 613+280+16 = 909 < 1024 ✓
    Capsule top             : 130 > 0                  ✓

  Centre du contenu :
    x : (512-280 + 512+280)/2 = 512  (parfaitement centre) ✓
    y : (130 + 613+280)/2     = 511  (parfaitement centre) ✓
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1024 1024"
  role="img"
  aria-label="Orbi"
>
  <title>Orbi</title>

  <!-- Fond -->
  <rect width="1024" height="1024" fill="#07111d" rx="228"/>

  <!-- Lueur de la capsule -->
  <rect x="440" y="120" width="144" height="236" rx="72" fill="#2dd4bf" fill-opacity="0.15"/>

  <!-- Anneau -->
  <circle
    cx="512" cy="613" r="280"
    fill="none"
    stroke="#2dd4bf"
    stroke-width="32"
  />

  <!-- Capsule nord -->
  <rect x="462" y="130" width="100" height="216" rx="51" fill="#2dd4bf"/>
</svg>
