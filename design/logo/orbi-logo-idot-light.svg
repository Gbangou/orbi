<!-- Orbi — Concept "i-dot" variante fond clair -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 480 180"
  role="img"
  aria-label="Orbi"
>
  <title>Orbi — i-dot concept (fond clair)</title>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@300;800&amp;display=swap');
    </style>
    <filter id="glow-light" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond blanc -->
  <rect width="480" height="180" fill="#ffffff" rx="20"/>

  <!-- "Orb" -->
  <text
    x="52"
    y="118"
    font-family="Raleway, 'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="64"
    font-weight="800"
    fill="#07111d"
    letter-spacing="2"
  >Orb</text>

  <!-- "ı" sans point -->
  <text
    x="278"
    y="118"
    font-family="Raleway, 'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="64"
    font-weight="800"
    fill="#07111d"
    letter-spacing="2"
  >ı</text>

  <!-- Halo -->
  <circle cx="308.7" cy="37.3" r="22" fill="#2dd4bf" fill-opacity="0.14"/>

  <!-- Anneau orbital -->
  <circle
    cx="296"
    cy="50"
    r="18"
    fill="none"
    stroke="#2dd4bf"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- Point-vehicule -->
  <circle
    cx="308.7"
    cy="37.3"
    r="7.5"
    fill="#2dd4bf"
    filter="url(#glow-light)"
  />

  <!-- Label -->
  <text
    x="240"
    y="158"
    font-family="Raleway, 'Helvetica Neue', Arial, sans-serif"
    font-size="11"
    font-weight="300"
    fill="#07111d"
    fill-opacity="0.30"
    text-anchor="middle"
    letter-spacing="4"
  >CONCEPT IDOT</text>

</svg>
